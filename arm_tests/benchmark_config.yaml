# ══════════════════════════════════════════════════════════════════════════════
# LibreYOLO Inference Benchmark — Configuration
# ══════════════════════════════════════════════════════════════════════════════
#
# Run:
#   python libreyolo_inference_benchmark.py
#   python libreyolo_inference_benchmark.py --config benchmark_config.yaml
#
# Supported model paths (auto-detected by extension / name):
#
#   YOLOX detection:
#     LibreYOLOXn.pt  LibreYOLOXt.pt  LibreYOLOXs.pt
#     LibreYOLOXm.pt  LibreYOLOXl.pt  LibreYOLOXx.pt
#
#   YOLOv9 detection:
#     LibreYOLO9t.pt  LibreYOLO9s.pt  LibreYOLO9m.pt  LibreYOLO9c.pt
#
#   RF-DETR detection  (requires: pip install libreyolo[rfdetr]):
#     LibreRFDETRn.pth  LibreRFDETRs.pth  LibreRFDETRm.pth  LibreRFDETRl.pth
#
#   RF-DETR segmentation  (requires: pip install libreyolo[rfdetr]):
#     LibreRFDETRn-seg.pth  LibreRFDETRs-seg.pth
#     LibreRFDETRm-seg.pth  LibreRFDETRl-seg.pth
#     → https://huggingface.co/LibreYOLO/LibreRFDETRn-seg
#
#   TensorRT engine  (requires: pip install libreyolo[tensorrt]):
#     weights/model.engine
#
#   ONNX  (requires: pip install libreyolo[onnx]):
#     weights/model.onnx
#
#   OpenVINO  (requires: pip install libreyolo[openvino]):
#     weights/model_openvino/   ← directory containing model.xml
#
# ══════════════════════════════════════════════════════════════════════════════


# ── Model ─────────────────────────────────────────────────────────────────────
model:
  # Path to weights file (or directory for OpenVINO).
  # If the file is not found locally, LibreYOLO auto-downloads from HuggingFace.
  path: "LibreYOLOXs.pt" #"yolox_x.engine" # "LibreRFDETRl-seg.pt" #"LibreYOLOXs.pt"

  # Override class count (leave null to auto-detect from weights metadata)
  nb_classes: null

  # Inference device: "auto" | "cpu" | "cuda" | "0" | "1"
  device: "auto"

  # RF-DETR size override — used when the native rfdetr fallback is active.
  # The size is normally auto-detected from the filename (LibreRFDETRl → "l").
  # Override here if the filename is ambiguous: "n" | "s" | "m" | "l" | "xl"
  rfdetr_size: null


# ── Inference parameters ──────────────────────────────────────────────────────
inference:
  # Confidence threshold — detections below this are discarded
  conf: 0.25

  # NMS IoU threshold — overlapping boxes above this are merged
  iou: 0.45

  # Input resolution override (null = model's native size)
  #   YOLOX: usually 640       YOLOv9: usually 640
  #   RF-DETR-n: 384  -s: 512  -m: 576  -l: 704
  imgsz: 640

  # Filter to specific COCO class IDs (null = keep all)
  # Example: [0, 2, 5]  →  person, car, bus only
  classes: null

  # Maximum detections per frame
  max_det: 300

  # Tiled inference for very large images (YOLOX / YOLOv9 only)
  tiling: false
  overlap_ratio: 0.2


# ── Input source ──────────────────────────────────────────────────────────────
source:
  # Source type:
  #   "fake"   — loop image_path as a synthetic video stream
  #   "image"  — same as fake (runs num_frames inferences on one image)
  #   "video"  — read from video_path  (mp4, avi, …)
  #   "webcam" — live USB / built-in camera
  type: "fake"

  # Image used for "fake" and "image" modes.
  # tools.jpeg is in the same directory as this script.
  image_path: "tools.jpeg"

  # Path to a video file (used only when type: "video")
  video_path: null           # e.g. "/path/to/clip.mp4"

  # USB / built-in camera device index (used only when type: "webcam")
  # 0 = first detected camera, 1 = second, …
  webcam_index: 0

  # Total frames to process.
  # Set to 0 for unlimited (webcam only; stop with  q  in the stream window).
  num_frames: 100

  # Pre-resize frames to this width×height BEFORE passing them to the model.
  # libreyolo already handles internal resizing via imgsz= above, so this is
  # NOT needed for correct inference.  Leave null to pass the raw frame.
  # Only useful if you want to cap webcam capture resolution or simulate a
  # specific camera resolution in fake/image mode.
  # Example: [640, 640]  or  [1280, 720]
  pre_resize: null


# ── Output ────────────────────────────────────────────────────────────────────
output:
  # Open an OpenCV window showing live annotated frames.
  # Recommended for "webcam" and "video" sources; works for all sources.
  # Press  q  inside the window to stop early.
  show_stream: false

  # Title of the display window
  window_name: "LibreYOLO Benchmark"

  # Save annotated frames to disk
  save_frames: true
  save_dir: "runs/benchmark"

  # Maximum number of frames to write (avoids filling up storage)
  save_max_frames: 5


# ── Benchmark statistics ──────────────────────────────────────────────────────
benchmark:
  # Frames to run before recording metrics (GPU / CPU warm-up)
  warmup_frames: 5

  # Rolling window for avg / min / max / p95 computation
  window_size: 30


# ── Segmentation ──────────────────────────────────────────────────────────────
# These settings apply only when a segmentation model is loaded
# (e.g. LibreRFDETRn-seg.pth) and the result contains mask data.
segmentation:
  # Render instance masks when available
  enabled: true

  # Mask overlay transparency: 0.0 = invisible, 1.0 = fully opaque
  mask_alpha: 0.4


# ══════════════════════════════════════════════════════════════════════════════
# Quick-swap examples — copy the model.path line you want:
# ══════════════════════════════════════════════════════════════════════════════
#
# YOLOX (fastest on Jetson / edge):
#   model: {path: "LibreYOLOXn.pt",  device: "auto"}   # nano
#   model: {path: "LibreYOLOXs.pt",  device: "auto"}   # small  ← default
#   model: {path: "LibreYOLOXm.pt",  device: "auto"}   # medium
#
# YOLOv9:
#   model: {path: "LibreYOLO9t.pt",  device: "auto"}
#   model: {path: "LibreYOLO9c.pt",  device: "auto"}
#
# RF-DETR detection:
#   model: {path: "LibreRFDETRn.pth", device: "auto"}
#   model: {path: "LibreRFDETRs.pth", device: "auto"}
#
# RF-DETR segmentation:
#   model: {path: "LibreRFDETRn-seg.pth", device: "auto"}   # nano seg
#   model: {path: "LibreRFDETRs-seg.pth", device: "auto"}   # small seg
#
# TensorRT (.engine auto-detected):
#   model: {path: "weights/model.engine", device: "auto"}
#
# ONNX:
#   model: {path: "weights/model.onnx", device: "auto"}
#
# OpenVINO:
#   model: {path: "weights/model_openvino/", device: "auto"}
#
# Webcam live stream with segmentation:
#   source: {type: "webcam", webcam_index: 0, num_frames: 0}
#   output: {show_stream: true}
#   model:  {path: "LibreRFDETRn-seg.pth", device: "auto"}
