name: Build, Test & Push Docker Image

on:
  push:
    branches:
      - feature/test-workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Not needed atm, also because this approach would allow just a git op within the same repo (useless) 
      # we should setup Multiple Repos Using a GitHub App
      # - name: Set up SSH agent
      #   uses: webfactory/ssh-agent@v0.9.0
      #   with:
      #     ssh-private-key: ${{ secrets.PRIVATE_ACTIONS_DEPLOY }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Make build script executable
        run: chmod +x Docker/build_container.sh
      
      - name: Build Docker image with SSH
        run: cd ./Docker && ./build_container.sh
        env:
          DOCKER_BUILDKIT: 1
      
      - name: Verify image was built
        run: |
          if docker images | grep -q "eut_ros_torch.*jazzy"; then
            echo "✅ Image eut_ros_torch:jazzy successfully built"
            docker images eut_ros_torch:jazzy
          else
            echo "❌ Image eut_ros_torch:jazzy not found"
            echo "Available images:"
            docker images
            exit 1
          fi
        
      # 🔧 Build workspace and run test
      - name: Build & test workspace
        run: |
          source Docker/.env
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${BUILT_IMAGE} \
            bash -c "source /opt/ros/${TARGET_DISTRO}/setup.bash && \
                     colcon build --symlink-install \
                       --packages-select simple_cpp \
                       --cmake-args -DCMAKE_CXX_FLAGS='--coverage' \
                                    -DCMAKE_C_FLAGS='--coverage' \
                                    -DCMAKE_EXE_LINKER_FLAGS='--coverage' && \
                     colcon build --symlink-install \
                       --packages-skip simple_cpp && \
                     colcon test \
                       --event-handlers console_direct+ \
                       --pytest-args '-v' \
                       --return-code-on-test-failure || true"

      # 🔍 Debug: List generated test files
      # - name: List test result files
      #   if: always()
      #   run: |
      #     echo "📁 Searching for test result files..."
      #     echo "=== XML files found: ==="
      #     find ${{ github.workspace }}/build -name "*.xml" -type f || echo "No XML files found"
      #     echo ""
      #     echo "=== Directory structure: ==="
      #     ls -laR ${{ github.workspace }}/build/*/test_results/ 2>/dev/null || echo "Test results directory not found"
      #     echo ""
      #     echo "=== Build directory: ==="
      #     ls -la ${{ github.workspace }}/build/ || echo "Build directory not found"

      # Generate human-readable test summary
      - name: Generate test summary
        if: always()
        run: |
          source Docker/.env
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${BUILT_IMAGE} \
            bash -c "source /opt/ros/${TARGET_DISTRO}/setup.bash && \
                     colcon test-result --all --verbose" > test_summary.txt
          
          # Display in logs
          cat test_summary.txt
          
          # Create GitHub Actions summary
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      # Generate code coverage reports
      - name: Generate coverage reports
        if: always()
        run: |
          source Docker/.env
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${BUILT_IMAGE} \
            bash -c "/quick_coverage.sh" \
            > coverage_summary.txt || true
          
          # Display in logs
          cat coverage_summary.txt
          
          # Add to GitHub Actions summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      # Generate custom coverage report for PR
      - name: Generate coverage PR report
        if: always()
        run: |
          # Extract Python coverage
          if [ -f "build/simple_py/coverage.lcov" ]; then
            PY_LINES_HIT=$(grep -E "^LH:" build/simple_py/coverage.lcov | cut -d: -f2 | awk '{s+=$1} END {print s}')
            PY_LINES_FOUND=$(grep -E "^LF:" build/simple_py/coverage.lcov | cut -d: -f2 | awk '{s+=$1} END {print s}')
            if [ "$PY_LINES_FOUND" -gt 0 ]; then
              PY_COV=$(awk "BEGIN {printf \"%.1f\", ($PY_LINES_HIT/$PY_LINES_FOUND)*100}")
            else
              PY_COV="0.0"
            fi
          else
            PY_COV="N/A"
            PY_LINES_HIT=0
            PY_LINES_FOUND=0
          fi
          
          # Extract C++ coverage
          if [ -f "build/simple_cpp/coverage_filtered.info" ]; then
            source Docker/.env
            docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              -w /workspace \
              ${BUILT_IMAGE} \
              bash -c "lcov --summary build/simple_cpp/coverage_filtered.info 2>&1 | grep -oP 'lines......: \K[0-9.]+' || echo '0'" > cpp_cov_raw.txt
            CPP_COV=$(cat cpp_cov_raw.txt)
            CPP_LINES=$(grep -E "^LF:" build/simple_cpp/coverage_filtered.info | cut -d: -f2 | awk '{s+=$1} END {print s}')
            CPP_LINES_HIT=$(grep -E "^LH:" build/simple_cpp/coverage_filtered.info | cut -d: -f2 | awk '{s+=$1} END {print s}')
          else
            CPP_COV="N/A"
            CPP_LINES=0
            CPP_LINES_HIT=0
          fi
          
          # Create markdown report
          cat > coverage-pr-report.md << 'EOF'
          ## 📊 Code Coverage Report
          
          | Package | Coverage | Lines Hit | Total Lines |
          |---------|----------|-----------|-------------|
          | **simple_py** (Python) | $PY_COV% | $PY_LINES_HIT | $PY_LINES_FOUND |
          | **simple_cpp** (C++) | $CPP_COV% | $CPP_LINES_HIT | $CPP_LINES |
          
          > 🟢 ≥ 80% &nbsp;&nbsp; 🟡 ≥ 60% &nbsp;&nbsp; 🟠 ≥ 40% &nbsp;&nbsp; 🔴 < 40%
          
          📁 Detailed HTML reports available in workflow artifacts.
          EOF
          
          # Replace variables
          sed -i "s/\$PY_COV/$PY_COV/g" coverage-pr-report.md
          sed -i "s/\$PY_LINES_HIT/$PY_LINES_HIT/g" coverage-pr-report.md
          sed -i "s/\$PY_LINES_FOUND/$PY_LINES_FOUND/g" coverage-pr-report.md
          sed -i "s/\$CPP_COV/$CPP_COV/g" coverage-pr-report.md
          sed -i "s/\$CPP_LINES_HIT/$CPP_LINES_HIT/g" coverage-pr-report.md
          sed -i "s/\$CPP_LINES/$CPP_LINES/g" coverage-pr-report.md
          
          cat coverage-pr-report.md
      
      # Add coverage report to PR comment
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: coverage-pr-report.md
      
      # Upload coverage reports as artifacts
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            simple_py/htmlcov/**
            build/simple_cpp/coverage_html/**
            coverage_summary.txt
      
      # Generate Test Report Badge
      - name: Generate Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ROS 2 Tests
          path: 'build/*/test_results/**/*.xml,build/*/pytest.xml'
          reporter: java-junit
          fail-on-error: false
      
      # Upload test result
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/*/test_results/**/*.xml
            build/*/pytest.xml
            log/latest_test/**/*.log
            test_summary.txt
      
      # Create test badge (for README)
      - name: Create test badge
        if: always() && github.ref == 'refs/heads/main'
        run: |
          # Parse the summary line from test_summary.txt
          # Example line: "Summary: 55 tests, 0 errors, 0 failures, 6 skipped"
          if [ -f test_summary.txt ]; then
            SUMMARY_LINE=$(grep "^Summary:" test_summary.txt)
            
            # Extract numbers using grep and cut
            TOTAL=$(echo "$SUMMARY_LINE" | grep -oP '\d+(?= tests)' || echo "0")
            FAILURES=$(echo "$SUMMARY_LINE" | grep -oP '\d+(?= failures)' || echo "0")
            ERRORS=$(echo "$SUMMARY_LINE" | grep -oP '\d+(?= errors)' || echo "0")
            
            # Calculate passed tests (total - failures - errors)
            PASSED=$((TOTAL - FAILURES - ERRORS))
            FAILED=$((FAILURES + ERRORS))
            
            echo "📊 Badge stats: $PASSED passed / $FAILED failed (out of $TOTAL total)"
          else
            echo "⚠️ test_summary.txt not found, using defaults"
            PASSED=0
            FAILED=0
          fi
          
          # Create badge JSON (shields.io endpoint format)
          COLOR="success"
          if [ $FAILED -gt 0 ]; then
            COLOR="critical"
          fi
          
          echo "{\"schemaVersion\": 1, \"label\": \"tests\", \"message\": \"$PASSED passed / $FAILED failed\", \"color\": \"$COLOR\"}" > test-badge.json
          
          cat test-badge.json

      - name: Upload badge data
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-badge
          path: test-badge.json
      
      # Create coverage badge (for README)
      - name: Create coverage badge
        if: always() && github.ref == 'refs/heads/main'
        run: |
          # Extract Python coverage percentage from lcov file
          if [ -f "build/simple_py/coverage.lcov" ]; then
            PY_LINES_HIT=$(grep -E "^LH:" build/simple_py/coverage.lcov | cut -d: -f2 | awk '{s+=$1} END {print s}')
            PY_LINES_FOUND=$(grep -E "^LF:" build/simple_py/coverage.lcov | cut -d: -f2 | awk '{s+=$1} END {print s}')
            if [ "$PY_LINES_FOUND" -gt 0 ]; then
              PY_COV_PCT=$(awk "BEGIN {printf \"%.0f\", ($PY_LINES_HIT/$PY_LINES_FOUND)*100}")
            else
              PY_COV_PCT=0
            fi
          else
            PY_COV_PCT=0
          fi
          
          # Extract C++ coverage percentage
          if [ -f "build/simple_cpp/coverage_filtered.info" ]; then
            source Docker/.env
            docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              -w /workspace \
              ${BUILT_IMAGE} \
              bash -c "lcov --summary build/simple_cpp/coverage_filtered.info 2>&1 | grep -oP 'lines......: \K[0-9.]+' || echo '0'" > cpp_cov.txt
            CPP_COV_PCT=$(cat cpp_cov.txt | cut -d. -f1)
          else
            CPP_COV_PCT=0
          fi
          
          # Calculate average coverage
          if [ $PY_COV_PCT -gt 0 ] || [ $CPP_COV_PCT -gt 0 ]; then
            AVG_COV=$(( (PY_COV_PCT + CPP_COV_PCT) / 2 ))
          else
            AVG_COV=0
          fi
          
          echo "📊 Coverage stats: Python: ${PY_COV_PCT}%, C++: ${CPP_COV_PCT}%, Average: ${AVG_COV}%"
          
          # Determine badge color
          if [ $AVG_COV -ge 80 ]; then
            COLOR="brightgreen"
          elif [ $AVG_COV -ge 60 ]; then
            COLOR="yellow"
          elif [ $AVG_COV -ge 40 ]; then
            COLOR="orange"
          else
            COLOR="red"
          fi
          
          # Create badge JSON
          echo "{\"schemaVersion\": 1, \"label\": \"coverage\", \"message\": \"${AVG_COV}%\", \"color\": \"$COLOR\"}" > coverage-badge.json
          cat coverage-badge.json

      - name: Upload coverage badge data
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage-badge.json

      - name: Tag image for Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          # Get the image name from .env file
          source Docker/.env
          DOCKERHUB_ORG=${{ secrets.DOCKERHUB_ORG }}
          
          # Tag the local image with Docker Hub organization name
          docker tag ${BUILT_IMAGE} ${DOCKERHUB_ORG}/eutrobai:${TARGET_DISTRO}
      
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          source Docker/.env
          DOCKERHUB_ORG=${{ secrets.DOCKERHUB_ORG }}
          
          # Push the main Tag
          docker push ${DOCKERHUB_ORG}/eutrobai:${TARGET_DISTRO}