name: Build, Test & Push Docker Image

on:
  push:
    branches:
      - feature/test-workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Not needed atm, also because this approach would allow just a git op within the same repo (useless) 
      # we should setup Multiple Repos Using a GitHub App
      # - name: Set up SSH agent
      #   uses: webfactory/ssh-agent@v0.9.0
      #   with:
      #     ssh-private-key: ${{ secrets.PRIVATE_ACTIONS_DEPLOY }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Make build script executable
        run: chmod +x Docker/build_container.sh
      
      - name: Build Docker image with SSH
        run: cd ./Docker && ./build_container.sh
        env:
          DOCKER_BUILDKIT: 1
      
      - name: Verify image was built
        run: |
          if docker images | grep -q "eut_ros_torch.*jazzy"; then
            echo "✅ Image eut_ros_torch:jazzy successfully built"
            docker images eut_ros_torch:jazzy
          else
            echo "❌ Image eut_ros_torch:jazzy not found"
            echo "Available images:"
            docker images
            exit 1
          fi
        
      # 🔧 Build workspace and run test
      - name: Build & test workspace
        run: |
          source Docker/.env
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${BUILT_IMAGE} \
            bash -c "source /opt/ros/${TARGET_DISTRO}/setup.bash && \
                     colcon build --symlink-install && \
                     source /opt/ros/${TARGET_DISTRO}/setup.bash && \
                     colcon test \
                       --event-handlers console_direct+ \
                       --pytest-args '--junitxml=pytest_results.xml -v' \
                       --return-code-on-test-failure || true"

      # Generate human-readable test summary
      - name: Generate test summary
        if: always()
        run: |
          source Docker/.env
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${BUILT_IMAGE} \
            bash -c "source /opt/ros/${TARGET_DISTRO}/setup.bash && \
                     colcon test-result --all --verbose" > test_summary.txt
          
          # Display in logs
          cat test_summary.txt
          
          # Create GitHub Actions summary
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      # Generate Test Report Badge (Option 2)
      - name: Generate Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ROS 2 Tests
          path: |
            build/*/test_results/**/*.xml
            build/*/test_results/**/*.gtest.xml
            build/**/pytest_results.xml
          reporter: java-junit
          fail-on-error: false
      
      # Upload test result
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/*/test_results/**/*.xml
            build/*/test_results/**/*.gtest.xml
            build/**/pytest_results.xml
            log/latest_test/**/*.log
      
      # Create test badge (for README)
      - name: Create test badge
        if: always() && github.ref == 'refs/heads/main'
        run: |
          source Docker/.env
          
          # Count passed/failed tests
          PASSED=$(grep -r "tests=\"" build/*/test_results/**/*.xml | \
                   grep -oP 'tests="\K[0-9]+' | awk '{sum+=$1} END {print sum}')
          FAILED=$(grep -r "failures=\"" build/*/test_results/**/*.xml | \
                   grep -oP 'failures="\K[0-9]+' | awk '{sum+=$1} END {print sum}')
          
          # Create badge JSON (can be used with shields.io endpoint badge)
          echo "{\"schemaVersion\": 1, \"label\": \"tests\", \"message\": \"$PASSED passed / $FAILED failed\", \"color\": \"$([ $FAILED -eq 0 ] && echo 'success' || echo 'critical')\"}" > test-badge.json

      - name: Upload badge data
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-badge
          path: test-badge.json

      - name: Tag image for Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          # Get the image name from .env file
          source Docker/.env
          DOCKERHUB_ORG=${{ secrets.DOCKERHUB_ORG }}
          
          # Tag the local image with Docker Hub organization name
          docker tag ${BUILT_IMAGE} ${DOCKERHUB_ORG}/eutrobai:${TARGET_DISTRO}
      
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          source Docker/.env
          DOCKERHUB_ORG=${{ secrets.DOCKERHUB_ORG }}
          
          # Push the main Tag
          docker push ${DOCKERHUB_ORG}/eutrobai:${TARGET_DISTRO}